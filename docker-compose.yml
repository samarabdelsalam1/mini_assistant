services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.development
    env_file: .env 
    container_name: mini_assistant_web
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - sqlite_data:/app/storage
    environment:
      RAILS_ENV: development   
    stdin_open: true
    tty: true

volumes:
  bundle_cache:
  sqlite_data: